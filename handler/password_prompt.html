<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Required - Short URL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 440px;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lock-icon {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            font-size: 15px;
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-group input::placeholder {
            color: #999;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(23, 37, 43, 0.12);
        }

        .submit-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(23, 37, 43, 0.16);
        }

        .submit-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            border: 1px solid #f3c7c0;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        :root {
            --ink: #17252b;
            --ink-soft: #5c6c72;
            --paper: #f4f7f6;
            --surface: #ffffff;
            --line: #d4dfdc;
            --teal: #087f78;
            --teal-dark: #05615c;
            --teal-pale: #d8f1ec;
            --coral-pale: #fde9e6;
            --coral-dark: #8d3026;
            --shadow: 0 18px 45px rgba(23, 37, 43, .10);
        }

        html { background: var(--paper); }
        body {
            background: var(--paper);
            color: var(--ink);
            padding: 24px;
            font-family: Aptos, "Trebuchet MS", ui-sans-serif, system-ui, sans-serif;
        }
        .container {
            position: relative;
            max-width: 480px;
            padding: 42px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            animation: none;
        }
        .theme-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            padding: 7px 9px;
            color: var(--ink-soft);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
        }
        .theme-toggle:hover { color: var(--teal-dark); border-color: var(--teal); }
        .lock-icon {
            color: var(--teal-dark);
            font-size: 52px;
            margin-bottom: 16px;
            animation: none;
        }
        h1 { color: var(--ink); font-size: clamp(28px, 5vw, 38px); letter-spacing: -.055em; }
        .description { color: var(--ink-soft); margin-bottom: 26px; }
        .input-group input {
            padding: 14px 50px 14px 15px;
            color: var(--ink);
            background: #fbfcfc;
            border: 1px solid var(--line);
            border-radius: 9px;
        }
        .input-group input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 4px rgba(8, 127, 120, .12);
        }
        .toggle-password { color: var(--ink-soft); }
        .submit-button {
            padding: 14px;
            color: #fff;
            background: var(--teal);
            border: 0;
            border-radius: 9px;
            box-shadow: none;
        }
        .submit-button:hover:not(:disabled) { background: var(--teal-dark); transform: none; box-shadow: none; }
        .error {
            color: var(--coral-dark);
            background: var(--coral-pale);
            border: 1px solid #f3c7c0;
            border-left-width: 1px;
            border-radius: 8px;
        }
        .footer { color: var(--ink-soft); }
        .footer a { color: var(--teal-dark); }
        button:focus-visible, input:focus-visible, a:focus-visible {
            outline: 3px solid rgba(8, 127, 120, .3);
            outline-offset: 2px;
        }
        [data-theme="dark"] {
            --ink: #edf8f5;
            --ink-soft: #adc3be;
            --paper: #101a1e;
            --surface: #19282d;
            --line: #355057;
            --teal: #55cfc0;
            --teal-dark: #75e1d2;
            --teal-pale: #214d4b;
            --coral-pale: #4b2928;
            --coral-dark: #ffc0b7;
        }
        [data-theme="dark"] body, [data-theme="dark"] html { background: var(--paper); }
        [data-theme="dark"] .input-group input { color: var(--ink); background: #142226; }
        @media (max-width: 480px) {
            body { padding: 14px; }
            .container { padding: 34px 22px 26px; }
            h1 { font-size: 28px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .lock-icon {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">☾ Dark mode</button>
        <div class="lock-icon">🔒</div>
        <h1>Password Required</h1>
        <p class="description">This short URL is password-protected. Please enter the password to continue to your destination.</p>

        <form id="passwordForm">
            <div class="input-group">
                <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter password"
                    required
                    autocomplete="off"
                    autofocus
                />
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                    👁️
                </button>
            </div>

            <button type="submit" class="submit-button" id="submitButton">
                <span id="buttonText">Unlock & Continue</span>
                <span id="buttonLoading" class="loading" style="display: none;"></span>
            </button>

            <div id="error" class="error"></div>
        </form>

        <div class="footer">
            Protected with <a href="https://github.com/mdastpak/short_url_generator" target="_blank">Short URL Generator</a>
        </div>
    </div>

    <script>
        // Get short URL from current path
        const shortURL = window.location.pathname.split('/').pop();

        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Handle form submission
        const form = document.getElementById('passwordForm');
        const submitButton = document.getElementById('submitButton');
        const buttonText = document.getElementById('buttonText');
        const buttonLoading = document.getElementById('buttonLoading');
        const errorDiv = document.getElementById('error');
        const themeToggle = document.getElementById('themeToggle');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('passwordPromptTheme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀ Light mode' : '☾ Dark mode';
        }

        setTheme(localStorage.getItem('passwordPromptTheme') || 'light');
        themeToggle.addEventListener('click', () => {
            setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value.trim();
            if (!password) {
                showError('Please enter a password');
                return;
            }

            // Show loading state
            submitButton.disabled = true;
            buttonText.style.display = 'none';
            buttonLoading.style.display = 'inline-block';
            errorDiv.classList.remove('show');

            try {
                const response = await fetch(`/verify-password/${shortURL}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Password correct - redirect back to short URL
                    // The session cookie is now set, so the redirect handler will process it
                    window.location.href = `/${shortURL}`;
                } else {
                    // Password incorrect or error
                    showError(data.error || 'Invalid password. Please try again.');
                    resetButton();
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                console.error('Error verifying password:', error);
                showError('An error occurred. Please try again.');
                resetButton();
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function resetButton() {
            submitButton.disabled = false;
            buttonText.style.display = 'inline';
            buttonLoading.style.display = 'none';
        }

        // Allow Enter key to submit form
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !submitButton.disabled) {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // Clear error when user types
        passwordInput.addEventListener('input', () => {
            errorDiv.classList.remove('show');
        });
    </script>
</body>
</html>
